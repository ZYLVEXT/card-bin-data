name: Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "*.*.*"
    paths:
      - ".gitignore"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "CHANGELOG.md"
      - "LICENSE"
      - "README.md"
      - "docs/**"
      - "examples/**"
      - "justfile"
      - "prek.toml"
      - "pyproject.toml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "uv.lock"
      - "zensical.toml"
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.3"

jobs:
  quality:
    name: Quality and dependency audit
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install development environment
        run: uv sync --frozen --all-extras --group dev
      - name: Run repository hooks with prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          SKIP: detect-aws-credentials,no-commit-to-branch
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          prek-version: "0.4.12"

  unit:
    name: Unit (${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [quality]
    if: github.event.repository.fork == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-2025-vs2026]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install test environment
        run: uv sync --frozen --all-extras --group dev
      - name: Run unit suite
        run: uv run --no-sync pytest -n 0 tests/unit

  integration:
    name: SQLite, PostgreSQL, and coverage
    needs: [quality]
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: card_bin_data
          POSTGRES_PASSWORD: card_bin_data
          POSTGRES_USER: card_bin_data
        options: >-
          --health-cmd "pg_isready -U card_bin_data -d card_bin_data"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CARD_BIN_DATA_POSTGRESQL_TEST_DATABASE_URL: postgresql+asyncpg://card_bin_data:card_bin_data@127.0.0.1:5432/card_bin_data
      COVERAGE_PROCESS_START: pyproject.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare complete environment
        run: |
          uv sync --frozen --all-extras --group dev
          uv run --no-sync python scripts/install_coverage_hook.py
      - name: Detect dead fixtures
        run: uv run --no-sync pytest --dead-fixtures
      - name: Run full backend suite
        run: >-
          uv run --no-sync pytest -n 0
          --cov=card_bin_data
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=100
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          files: coverage.xml
          use_oidc: true

  package:
    name: Release artifact dry run
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, inspect, and smoke-test artifacts
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          python scripts/release_artifacts.py build --dist-dir dist
          python scripts/release_artifacts.py smoke --dist-dir dist

  docs:
    name: Documentation build
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build documentation
        run: uv run --frozen --group docs zensical build --clean

  required-checks:
    name: Required checks
    needs: [quality, unit, integration, package, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require successful verification
        env:
          DOCS_RESULT: ${{ needs.docs.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          set -euo pipefail
          for result in "$QUALITY_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT" "$PACKAGE_RESULT" "$DOCS_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required verification job concluded: $result" >&2
              exit 1
            fi
          done

  dispatch-release:
    name: Dispatch verified release
    needs: [required-checks]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && needs.required-checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Run release workflow for the tested tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TESTS_RUN_ID: ${{ github.run_id }}
        run: gh workflow run 3_release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tests_run_id="$TESTS_RUN_ID"
